name: ci
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: sweeft
      - run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
        working-directory: sweeft
        env:
          DJANGO_DEBUG: "1"
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format check
        run: |
          cargo fmt --check --manifest-path contracts/sweeft/Cargo.toml
          cargo fmt --check --manifest-path contracts/stub-outlayer/Cargo.toml
      - name: Clippy (warnings are visible but allowed for now)
        run: |
          cargo clippy --all-targets --manifest-path contracts/sweeft/Cargo.toml
          cargo clippy --target wasm32-unknown-unknown --manifest-path contracts/stub-outlayer/Cargo.toml
      - name: Build contract wasm (sandbox artifact)
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: contracts/sweeft
      - name: Build sandbox stub OutLayer runner
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/stub-outlayer/Cargo.toml
      - name: Unit + invariant tests (proptest) and sandbox lifecycle (near-workspaces)
        run: cargo test
        working-directory: contracts/sweeft
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          cargo fmt --check
          cargo clippy
          cargo test
        working-directory: wasi/sweeft-verify
